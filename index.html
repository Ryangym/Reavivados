<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas de Mídia - Igreja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 2.5rem; }
        p.subtitle { color: #7f8c8d; margin-bottom: 40px; font-size: 1.2rem; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 20px; }

        .menu-card { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: transform 0.3s, box-shadow 0.3s; text-decoration: none; color: #333; display: flex; flex-direction: column; align-items: center; border: 2px solid transparent; }
        
        /* Cores Específicas para cada Card */
        .card-reavivados { border-bottom-color: #3498db; }
        .card-reavivados .icon-box { background: #e3f2fd; color: #3498db; }
        .card-reavivados:hover { border-color: #3498db; }

        .card-escala { border-bottom-color: #e67e22; }
        .card-escala .icon-box { background: #fdf0e3; color: #e67e22; }
        .card-escala:hover { border-color: #e67e22; }

        .menu-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        .icon-box { width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; margin-bottom: 25px; transition: 0.3s; }
        
        h2 { margin: 0 0 15px 0; font-size: 1.8rem; color: #2c3e50; }
        p.desc { color: #7f8c8d; margin: 0; line-height: 1.5; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Central de Mídia</h1>
    <p class="subtitle">Selecione a ferramenta que deseja utilizar</p>

    <div class="menu-grid">
        <a href="reavivados.html" class="menu-card card-reavivados">
            <div class="icon-box"><i class="fas fa-bible"></i></div>
            <h2>Reavivados Quiz</h2>
            <p class="desc">Gerador de slides em PowerPoint com perguntas, correção animada e gabarito.</p>
        </a>

        <a href="escala.html" class="menu-card card-escala">
            <div class="icon-box"><i class="fas fa-calendar-alt"></i></div>
            <h2>Gerador de Escala</h2>
            <p class="desc">Crie imagens profissionais da escala da semana para postar nas redes sociais.</p>
        </a>
    </div>
</div>

</body>
</html>
