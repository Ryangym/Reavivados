<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Escala</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Montserrat:wght@300;400;700;800&family=Pacifico&family=Satisfy&display=swap" rel="stylesheet">

    <style>
        /* --- GERAL --- */
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #333; }
        
        .main-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* Desktop: Lado a Lado */
            gap: 40px; 
            align-items: start; 
        }
        
        .back-link { display: inline-block; margin-bottom: 20px; color: #b45309; text-decoration: none; font-weight: bold; font-family: 'Montserrat', sans-serif; }

        /* --- FORMULÁRIO --- */
        .form-panel { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #b45309; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.5rem; text-transform: uppercase; margin-bottom: 25px; border-bottom: 2px solid #fef3c7; padding-bottom: 15px; }
        
        label { display: block; margin-top: 15px; font-weight: 700; color: #555; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #e5e7eb; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; background: #f9fafb; transition: 0.2s; }
        input[type="text"]:focus, select:focus { border-color: #f59e0b; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }

        .input-grid { display: grid; grid-template-columns: 30px 1fr 1fr 1fr; gap: 8px; align-items: center; margin-top: 20px; }
        .grid-header { text-align: center; font-weight: bold; color: #d97706; font-size: 0.7rem; text-transform: uppercase; }
        .row-num { font-weight: bold; color: #9ca3af; text-align: center; font-family: 'Montserrat', sans-serif; font-size: 0.8rem; }
        
        .btn-download { width: 100%; padding: 18px; background: linear-gradient(135deg, #b45309, #d97706); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 25px; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 10px 20px rgba(180, 83, 9, 0.2); transition: 0.3s; }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(180, 83, 9, 0.3); }

        /* --- PREVIEW CONTAINER (Fluido) --- */
        .preview-container { 
            width: 100%; /* Ocupa a largura da coluna */
        }
        
        /* --- CAIXA DA IMAGEM --- */
        #escala-image-box {
            width: 100%; /* Adapta ao pai */
            aspect-ratio: 1 / 1; /* Mantém sempre quadrado */
            background: #0f172a; 
            position: relative;
            overflow: hidden;
            display: flex; 
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            font-family: 'Montserrat', sans-serif;
            border-radius: 12px; /* Arredondado na tela, quadrado no download */
        }

        /* --- DESIGN INTERNO (Fundo) --- */
        .bg-layer { position: absolute; inset: 0; z-index: 0; }
        .bg-gradient { background: radial-gradient(circle at top right, #1e293b, #0f172a); }
        .bg-glow-1 { position: absolute; top: -20%; right: -20%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%); border-radius: 50%; }
        .bg-glow-2 { position: absolute; bottom: -20%; left: -20%; width: 50%; height: 50%; background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%); border-radius: 50%; }
        .bg-texture { background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4='); opacity: 0.3; }

        /* --- CONTEÚDO (Flexbox Vertical para preencher espaço) --- */
        .img-content { 
            position: relative; 
            z-index: 10; 
            padding: 5%; /* Padding em porcentagem para escalar */
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            justify-content: space-between; 
        }

        /* Cabeçalho */
        .header-box { text-align: center; margin-bottom: 2%; }
        
        /* Fontes Fluidas (Usando vw/em para escalar) */
        .img-title-top { 
            color: #fbbf24; 
            font-size: 2.5cqw; /* Relativo ao container (se suportado) ou fallback via media query */
            font-size: 1.8vmin; /* Fallback inteligente */
            letter-spacing: 0.3em; 
            font-weight: 700; 
            text-transform: uppercase;
            margin-bottom: 0.5em;
            display: inline-block;
            border-bottom: 1px solid rgba(251, 191, 36, 0.5);
            padding-bottom: 0.3em;
        }
        .img-title-main { 
            color: #ffffff; 
            font-size: 5vmin; 
            font-weight: 800; 
            line-height: 1.1;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Tabela */
        .table-wrapper { 
            width: 100%; 
            flex-grow: 1; /* Ocupa todo espaço disponível */
            display: flex; 
            align-items: center; 
        }
        
        .scale-table { 
            width: 100%; 
            height: 100%; /* Força altura total */
            border-collapse: separate; 
            border-spacing: 0 0.8vh; /* Espaço vertical proporcional */
        }

        .scale-table thead th { 
            text-align: center; color: #0f172a; 
            font-size: 1.8vmin; 
            text-transform: uppercase; letter-spacing: 1px; padding: 1% 0; font-weight: 800;
            background: linear-gradient(90deg, #f59e0b, #fbbf24); border-radius: 4px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);
            font-family: 'Montserrat', sans-serif;
        }
        .scale-table thead th:first-child { background: transparent; box-shadow: none; }

        /* Células */
        .scale-table td { 
            padding: 0; text-align: center; vertical-align: middle; color: white;
            font-family: 'Great Vibes', cursive; 
            font-size: 3.5vmin; /* Tamanho proporcional à tela */
            letter-spacing: 1px; line-height: 1; 
            height: 10%; /* Divide o espaço igualmente */
        }

        .scale-table td.num-cell {
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 800; font-size: 2vmin; width: 8%; padding-top: 0;
        }

        /* Linhas */
        .row-odd td:not(.num-cell) { background: rgba(30, 41, 59, 0.6); border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .row-odd td:nth-child(2) { border-left: 1px solid rgba(255,255,255,0.05); border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .row-odd td:last-child { border-right: 1px solid rgba(255,255,255,0.05); border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

        .row-even td:not(.num-cell) { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .row-even td:nth-child(2) { border-left: 4px solid #f59e0b; border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .row-even td:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

        .num-badge { display: inline-block; width: 4vmin; height: 4vmin; line-height: 4vmin; border-radius: 50%; background: rgba(255,255,255,0.1); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }
        .row-even .num-badge { background: #f59e0b; color: #0f172a; border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

        .img-footer { text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2%; color: rgba(255,255,255,0.4); font-size: 1.5vmin; letter-spacing: 2px; text-transform: uppercase; font-family: 'Montserrat', sans-serif; }

        /* --- RESPONSIVIDADE (MOBILE) --- */
        @media (max-width: 900px) {
            /* Empilha os painéis */
            .main-container { grid-template-columns: 1fr; gap: 30px; }
            
            /* Ajusta a ordem para o preview ficar embaixo ou em cima conforme gosto (aqui deixei embaixo) */
            .preview-container {  }
            
            /* Compacta inputs */
            .input-grid { gap: 5px; }
            .input-grid input[type="text"] { padding: 8px; font-size: 0.85rem; }
            
            /* AJUSTE FINO DAS FONTES NO MOBILE */
            /* Como vmin muda no celular (vertical), ajustamos para garantir legibilidade */
            .img-title-main { font-size: 6vw; }
            .img-title-top { font-size: 2.5vw; }
            .scale-table td { font-size: 4.5vw; }
            .scale-table thead th { font-size: 2.5vw; }
            .scale-table td.num-cell { font-size: 2.5vw; }
            .num-badge { width: 5vw; height: 5vw; line-height: 5vw; }
            .img-footer { font-size: 2vw; }
        }
    </style>
</head>
<body>

<div style="max-width: 1200px; margin: 0 auto;">
    <a href="index.html" class="back-link">← Voltar ao Menu Principal</a>
</div>

<div class="main-container">
    
    <div class="form-panel">
        <h1>Preencher Escala</h1>
        
        <label>Título (Pequeno):</label>
        <input type="text" id="inputTitulo" value="ESCALA DE MARÇO" oninput="atualizar()">
        
        <label>Subtítulo (Grande):</label>
        <input type="text" id="inputSubtitulo" value="MINISTÉRIO DE LOUVOR" oninput="atualizar()">

        <label style="margin-top:20px; color:#d97706;">Estilo da Fonte:</label>
        <select id="fontSelector" onchange="mudarFonte()" style="width:100%; padding:12px; border-radius:8px; border:1px solid #d97706; color:#d97706; font-weight:bold; cursor:pointer;">
            <option value="'Great Vibes', cursive">Great Vibes (Clássica)</option>
            <option value="'Dancing Script', cursive">Dancing Script (Legível)</option>
            <option value="'Pacifico', cursive">Pacifico (Moderna)</option>
            <option value="'Alex Brush', cursive">Alex Brush (Fina)</option>
            <option value="'Satisfy', cursive">Satisfy (Pincel)</option>
        </select>

        <label style="margin-top:25px; border-bottom: 1px solid #eee; padding-bottom:5px;">Grade:</label>
        <div class="input-grid">
            <div class="grid-header">#</div>
            <div class="grid-header">Quarta</div>
            <div class="grid-header">Sábado</div>
            <div class="grid-header">Domingo</div>

            <div class="row-num">1</div><input type="text" id="qua1" oninput="atualizar()"><input type="text" id="sab1" oninput="atualizar()"><input type="text" id="dom1" oninput="atualizar()">
            <div class="row-num">2</div><input type="text" id="qua2" oninput="atualizar()"><input type="text" id="sab2" oninput="atualizar()"><input type="text" id="dom2" oninput="atualizar()">
            <div class="row-num">3</div><input type="text" id="qua3" oninput="atualizar()"><input type="text" id="sab3" oninput="atualizar()"><input type="text" id="dom3" oninput="atualizar()">
            <div class="row-num">4</div><input type="text" id="qua4" oninput="atualizar()"><input type="text" id="sab4" oninput="atualizar()"><input type="text" id="dom4" oninput="atualizar()">
            <div class="row-num">5</div><input type="text" id="qua5" oninput="atualizar()"><input type="text" id="sab5" oninput="atualizar()"><input type="text" id="dom5" oninput="atualizar()">
        </div>

        <button class="btn-download" onclick="baixarImagem()">BAIXAR IMAGEM HD</button>
    </div>

    <div class="preview-container">
        <div id="escala-image-box">
            <div class="bg-layer bg-gradient"></div>
            <div class="bg-layer bg-texture"></div>
            <div class="bg-layer bg-glow-1"></div>
            <div class="bg-layer bg-glow-2"></div>

            <div class="img-content">
                <div class="header-box">
                    <div id="outTitulo" class="img-title-top">ESCALA DE MARÇO</div>
                    <div id="outSubtitulo" class="img-title-main">MINISTÉRIO DE LOUVOR</div>
                </div>

                <div class="table-wrapper">
                    <table class="scale-table">
                        <thead>
                            <tr>
                                <th></th>
                                <th>QUARTA</th>
                                <th>SÁBADO</th>
                                <th>DOMINGO</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="row-odd"><td class="num-cell"><span class="num-badge">1</span></td><td id="out-qua1"></td><td id="out-sab1"></td><td id="out-dom1"></td></tr>
                            <tr class="row-even"><td class="num-cell"><span class="num-badge">2</span></td><td id="out-qua2"></td><td id="out-sab2"></td><td id="out-dom2"></td></tr>
                            <tr class="row-odd"><td class="num-cell"><span class="num-badge">3</span></td><td id="out-qua3"></td><td id="out-sab3"></td><td id="out-dom3"></td></tr>
                            <tr class="row-even"><td class="num-cell"><span class="num-badge">4</span></td><td id="out-qua4"></td><td id="out-sab4"></td><td id="out-dom4"></td></tr>
                            <tr class="row-odd"><td class="num-cell"><span class="num-badge">5</span></td><td id="out-qua5"></td><td id="out-sab5"></td><td id="out-dom5"></td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="img-footer">Mídia Igreja Local • Servindo com Excelência</div>
            </div>
        </div>
        <p style="text-align: center; color: #999; margin-top: 10px; font-size: 0.8rem;">Visualização real (1:1)</p>
    </div>
</div>

<script>
    function atualizar() {
        document.getElementById('outTitulo').innerText = document.getElementById('inputTitulo').value || "";
        document.getElementById('outSubtitulo').innerText = document.getElementById('inputSubtitulo').value || "";

        const dias = ['qua', 'sab', 'dom'];
        for(let i = 1; i <= 5; i++) {
            dias.forEach(dia => {
                const val = document.getElementById(dia + i).value;
                const cell = document.getElementById('out-' + dia + i);
                
                if(val.trim() === "") {
                    cell.innerHTML = "<span style='opacity:0.1; font-family:Montserrat;'>—</span>";
                } else {
                    cell.innerText = val;
                }
            });
        }
    }

    function mudarFonte() {
        const fonteSelecionada = document.getElementById('fontSelector').value;
        const celulas = document.querySelectorAll('.scale-table td:not(.num-cell)');
        celulas.forEach(td => { td.style.fontFamily = fonteSelecionada; });
    }

    function baixarImagem() {
        const btn = document.querySelector('.btn-download');
        const box = document.getElementById('escala-image-box');
        
        btn.innerText = "GERANDO...";
        btn.disabled = true;

        // Tira o arredondamento para a imagem final ser quadrada perfeita nas pontas
        box.style.borderRadius = "0";

        document.fonts.ready.then(function () {
            html2canvas(box, {
                scale: 3, // 3x = Super HD (aprox 1200-1800px dependendo da tela)
                useCORS: true,
                backgroundColor: null,
                width: box.offsetWidth, 
                height: box.offsetHeight 
            }).then(canvas => {
                // Restaura visual
                box.style.borderRadius = "12px";

                const link = document.createElement('a');
                link.download = 'Escala_Feed.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerText = "BAIXAR IMAGEM HD";
                btn.disabled = false;
            }).catch(err => {
                alert("Erro: " + err);
                box.style.borderRadius = "12px";
                btn.disabled = false;
            });
        });
    }

    // Inicia
    atualizar();
    mudarFonte();
</script>

</body>
</html>
